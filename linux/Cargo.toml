[package]
name = "ai-limit-counter"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "ai-limit-counter"
path = "src/main.rs"

[dependencies]
ksni      = "0.2"
tiny-skia = "0.11"
ureq      = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
