name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux helper
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test
        run: cargo +stable test --locked --manifest-path linux/Cargo.toml
      - name: Build release
        run: cargo +stable build --release --locked --manifest-path linux/Cargo.toml

  extensions:
    name: DMS and GNOME extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install GNOME test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gjs libglib2.0-bin
      - name: Test DMS formatting
        run: node --test dms/tests/format.test.js
      - name: Test GNOME formatting
        run: gjs -m gnome/tests/format.test.js
      - name: Validate GNOME schema
        run: glib-compile-schemas --strict --dry-run gnome/ailimitcounter@firatege.github.io/schemas
      - name: Validate installer scripts
        run: bash -n dms/install.sh gnome/install.sh

  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release
        run: swift build -c release
